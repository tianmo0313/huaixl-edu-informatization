<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>怀来县教育信息化资源库</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">

      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-5 9 5-9 5-9-5z"></path>
            <path d="M3 9v6l9 5 9-5V9"></path>
            <path d="M21 9v6"></path>

        <div class="brand-text">
          <span class="brand-title">怀来县教育信息化资源库</span>
          <span class="brand-sub">HUAILAI EDUCATION INFORMATIZATION RESOURCE HUB</span>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg>
          <input type="text" id="searchInput" placeholder="搜索资源、活动、通知…" autocomplete="off">
        </label>
        <a class="gh-link" href="https://github.com/tianmo0313/huaixl-edu-informatization" target="_blank" rel="noopener" title="在 GitHub 查看源码仓库">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"></path></svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边导航 -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="foot-badge">框架版本 v0.1</div>
        <div class="foot-note">怀来县教研室 · 维护</div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="main">
      <div class="content" id="content"></div>
      <footer class="page-foot">
        <span>怀来县教育信息化资源库 · 框架预览</span>
        <span class="foot-dot">·</span>
        <span>建库日期 2026-11-18</span>
      </footer>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</html>
